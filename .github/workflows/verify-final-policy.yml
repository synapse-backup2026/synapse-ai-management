name: Verify final policy

on:
  push:
    branches: [hostinger-nextjs-fix, work/synapse-phase-one]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/accountant-owner-policy.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
