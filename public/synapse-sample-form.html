<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; connect-src 'self'">
<title>برگهٔ تحویل و اطلاعات نمونه‌های محقق | SYNAPSE</title>
<style>
:root{font:16px/1.55 Tahoma,Arial,sans-serif;color:#191919;background:#f5f5f5}
*{box-sizing:border-box}
body{margin:0}
main{max-width:900px;margin:auto;padding:12px}
.shell,.archive{background:#fff;border:1px solid #e1e1e1;border-radius:18px;padding:clamp(14px,3vw,25px);box-shadow:0 5px 24px #00000006}
header,.row,.actions,.archiveTools,.record{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1,h2,h3,p{margin:0}
.logo{font:800 24px/1.2 Arial;letter-spacing:.035em}
h1{font-size:clamp(17px,4vw,24px);margin-top:5px}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px}
.sub,.hint,small{color:#595959;font-size:.83rem}
.badge,.count{background:#eee;border-radius:30px;padding:3px 10px;font-size:.77rem;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:11px 0;margin:14px 0 11px;border-block:1px solid #e5eeec;list-style:none}
.steps li{position:relative;min-width:0}
.steps li:not(:last-child)::after{content:'';position:absolute;inset-block-start:19px;inset-inline-start:calc(50% + 20px);width:calc(100% - 32px);height:2px;background:#dce6e3;pointer-events:none}
.steps li.completed::after{background:#26856c}
.step-progress{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.step-progress span{display:block;width:0;height:100%;background:#15803d;border-radius:inherit;transition:width .18s ease}
@media(prefers-reduced-motion:reduce){.step-progress span{transition:none}}
.steps button{display:grid;place-items:center;gap:3px;background:white;border-color:transparent;width:100%;height:100%;font-size:.8rem;padding:6px 4px;line-height:1.4;color:#252525}
.steps button:disabled{opacity:1;color:#595959}
.steps button[aria-current]{background:#eee;font-weight:bold}
.steps b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#eee}
.steps [aria-current] b,.steps .completed b{background:#246759;color:white}
.grid,.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.wide{grid-column:1/-1}
label{display:grid;gap:4px;min-width:0;font-size:.88rem;color:#414141}
input,select,textarea,button{font:inherit;color:inherit;min-width:0}
label :is(input:not([type=radio],[type=checkbox]),select,textarea),.archiveTools input,.record select{width:100%;border:1px solid #d5d5d5;border-radius:10px;background:#fdfdfd;padding:7px 10px;min-height:39px}
textarea{resize:vertical}
input[type=datetime-local]{display:block;min-width:0;max-width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #555;outline-offset:2px}
button{min-height:36px;border-radius:9px;border:1px solid #d6d6d6;background:#fff;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.48;cursor:default}.primary{background:#171717;color:#fff;border-color:#171717}
.actions{margin-top:12px;justify-content:flex-end}
.actions .primary{min-width:min(100%,160px)}
.sample,.summary,.review{border:1px solid #e1e1e1;border-radius:13px;padding:10px 12px;margin-top:8px;overflow-wrap:anywhere}
.sample>summary{cursor:pointer;font-weight:bold;margin-bottom:0}
.sample[open]>summary{margin-bottom:8px}
.sample .remove{margin-top:8px;font-size:.8rem;min-height:30px}
.measure,.summary{background:#f2f2f2}
.measure{border:0;border-radius:10px;min-inline-size:0;margin:0;padding:8px}
.measure legend{padding:0 4px;color:#252525;font-size:.88rem;font-weight:bold}
.measure output{display:block;font-size:.83rem;font-weight:600}
.sample-box{border:1px solid #dedede;border-radius:10px;padding:8px;min-inline-size:0;margin:0}
.sample-box legend{font-size:.88rem;font-weight:bold;padding:0 4px}
.sample-box .hint{margin:3px 0 6px}
.repeat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end;margin:5px 0}
.repeat-row button,.sample-box button{min-height:32px;font-size:.8rem}
.techniques,.date-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.date-fields{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:6px}
.techniques label{display:flex;align-items:baseline;gap:4px}
.choice{border:1px solid #e4e4e4;border-radius:10px;margin:0;min-inline-size:0;padding:5px 9px}
.choice legend{font-size:.88rem}.choice label,.check{display:flex;gap:7px;align-items:baseline;padding:3px 0}
input:is([type=radio],[type=checkbox]){accent-color:#171717;flex:none}
.check{margin-top:9px}
dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:5px 0;gap:3px 10px;font-size:.88rem}
dd{margin:0;text-align:end;overflow-wrap:anywhere}
.summary ol{border-top:1px solid #ddd;margin:7px 0 0;padding:6px 21px 0 0}
.summary li+li{margin-top:4px}.summary li p{font-size:.83rem;color:#555}
#message:empty{display:none}#message{color:#862a2a;margin:7px 0}
.archive{margin-top:9px}#staffIntakeLink:not([hidden]){display:inline-block;margin-top:8px;padding:5px 8px;color:#414141;font-size:.83rem}
.archive>summary{cursor:pointer;font-weight:bold}
.archiveTools{margin:9px 0 6px}.archiveTools input{flex:1 1 220px;width:auto}
.record{border-top:1px solid #e8e8e8;padding:7px 0;overflow-wrap:anywhere}
.record .row{justify-content:flex-end;flex:0 1 auto}
.record select{width:auto;max-width:100%;font-size:.8rem}
.archive h3{margin:8px 0 2px}.archiveTools button,.record button{font-size:.82rem}
@media(max-width:550px){.grid{grid-template-columns:minmax(0,1fr)} .pair{column-gap:6px}
 label :is(input,select,textarea){font-size:16px} .record .row{justify-content:flex-start}}
.calendar{max-width:330px;margin-top:6px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:6px}
.calendar-nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px}
.calendar-nav select{font:inherit;min-width:0}
.calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center;margin-top:4px}
.calendar-days button{padding:2px;min-height:32px}
.calendar-days button[aria-pressed=true]{background:#171717;color:#fff}
:root[data-embedded]{background:transparent;overflow:hidden}
[data-embedded] main{max-width:1100px;padding:2px 3px 12px}
[data-embedded] .shell,[data-embedded] .archive{border-color:#cddedb;box-shadow:0 5px 18px #164b4310}
[data-embedded] header{background:#edf6f4;border:1px solid #dcebe8;border-radius:12px;padding:10px 13px}
[data-embedded] .logo{color:#214a46}
[data-embedded] .steps button[aria-current]{background:#e4f1ed}
[data-embedded] .sample,[data-embedded] .sample-box{border-color:#d7e5e2}
[data-embedded] :is(.measure,.summary){background:#edf5f3}
[data-embedded] .archive>summary{color:#214a46}
[data-stage="1"] .sample-grid{gap:8px 10px}
.sample-grid{font-family:Vazirmatn,Tahoma,Arial,sans-serif}
.sample-grid label{font-size:.81rem}
.sample-grid label :is(input:not([type=checkbox]),select,textarea){padding:5px 8px;min-height:34px}
.sample-grid .sample-box{padding:5px 8px}
.sample-grid .repeat-row{margin:4px 0}
.sample-grid .measure .pair{grid-template-columns:repeat(3,minmax(0,1fr))}
.sample-grid .measure .pair label{grid-column:auto}
.material{border:1px solid #dce8e5;border-radius:9px;margin-top:6px;padding:6px 8px;background:#f7faf9;min-width:0}
.material>summary{cursor:pointer;font-size:.82rem;font-weight:600}
.material[open]>summary{margin-bottom:5px}
.material-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px 8px}
.material-fields .material-name{grid-column:span 2}
.materials button{margin-top:6px}
[data-assay-other]{margin-top:6px}
#archiveHelp{margin-top:4px}
[data-remove-sheet]{color:#8b2930}
@media(max-width:550px){
 .sample-grid .measure .pair,.material-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
 .sample-grid .measure .pair label:first-child,.material-fields .material-name{grid-column:1/-1}
 .sample-grid label :is(input,select,textarea){font-size:16px}
 .steps li:not(:last-child)::after{inset-inline-start:calc(50% + 16px);width:calc(100% - 24px)}
}
main{direction:rtl;text-align:right}
.steps{gap:clamp(8px,2.2vw,28px);margin-block:18px 14px}
.steps li:not(:last-child)::after{width:calc(100% + clamp(8px,2.2vw,28px) - 40px)}
.steps button{gap:6px;font-weight:600}
#wizard[data-stage="1"],#wizard[data-stage="2"]{font-family:Vazirmatn,"B Nazanin","Segoe UI",Tahoma,sans-serif}
.sample-grid{font-family:inherit}
.sample>summary{color:#214a46;font-weight:700}
.sample-grid .materials{background:#eff6fc;border-color:#c4d9ec}
.materials legend,.materials .hint,.materials [data-action="add-material"]{color:#194d79}
.materials .material{background:#fff;border-color:#d2e3f2}
.notice{padding:8px 10px;border-radius:8px;background:#f3f7f6;color:#26413e;margin-top:8px}
.check.confirmation{background:#fff1f1;color:#861f27;border:1px solid #efc2c4;border-radius:8px;padding:8px 10px;font-weight:700}
.check.confirmation input{accent-color:#861f27}
#sampleIncomplete{margin-top:8px;color:#862a2a}
#sampleIncomplete:empty{display:none}
button[aria-disabled="true"]{opacity:.58}
</style>
</head>
<body>
<main>
<section class="shell" aria-labelledby="title">
<header><div><div class="logo" lang="en">SYNAPSE</div><h1 id="title">برگهٔ تحویل و اطلاعات نمونه‌های محقق</h1><p class="sub" lang="en">Sample Information Form</p></div><span class="badge" id="previewBadge">پیش‌نمایش</span></header>
<ol class="steps" id="steps" aria-label="مراحل فرم"></ol>
<div class="step-progress" aria-hidden="true"><span id="stepProgress"></span></div>
<p id="message" role="alert"></p>
<form id="wizard" novalidate></form>
</section>
<details class="archive" id="archive"><summary><span id="archiveTitle">پرونده‌های آزمایشی این مرورگر</span> <span class="count" id="archiveCount">۰</span></summary>
<p class="hint" id="archiveHelp">برای بررسی فهرست داخلی. ذخیره و انتخاب مقصد فقط در همین مرورگر انجام می‌شود. برای آزمایش از دادهٔ نمونه استفاده کنید.</p>
<div class="archiveTools"><input type="search" id="search" placeholder="نام پژوهشگر یا شماره فاکتور" aria-label="جست‌وجوی پرونده‌ها"><button type="button" id="newSheet">برگهٔ جدید</button></div>
<p id="archiveStatus" class="hint" role="status"></p>
<div id="records"></div>
</details>
<a href="/sample-intake?mode=staff" target="_parent" id="staffIntakeLink" hidden>پذیرش نمونه و سوابق کارکنان</a>
</main>
<script>
'use strict';
const types=['بافت / ارگان','سرم','پلاسما','خون کامل','سلول / لیزات','RNA / DNA','پروتئین','محیط کشت','دارو / ماده آزمایشی','ادرار','سایر'];
const species=['انتخاب کنید','رت (Rat)','موش (Mouse)','خرگوش','انسان (کدگذاری‌شده)','رده سلولی','سایر / نامشخص'];
const units=['میلی‌گرم (mg)','گرم (g)','میکروگرم (µg)','میلی‌لیتر (mL)','میکرولیتر (µL)','تعداد سلول','قطعه / عدد'];
const conditions=['منجمد (Frozen)','تازه (Fresh)','فیکس‌شده (Fixed)','استخراج / فرآوری‌شده','سایر / نیازمند بررسی'];
const deliveries=['ارسال با پیک','ارسال پستی','تحویل حضوری','هنوز مشخص نیست'];
const temperatures=['دمای محیط','یخچالی، حدود ۲ تا ۸ درجه سانتی‌گراد','منجمد','سایر / نیازمند هماهنگی'];
const assays=['مطالعات حیوانی','بافت‌شناسی / پاتولوژی','پاتولوژی مولکولی (بیان ژن، وسترن و غیره)','الایزا (ELISA)','تست‌های سلولی','میکروب‌شناسی','سایر آزمون‌ها'];
const otherType=types.length-1;
const sampleName=s=>s.type===otherType?s.name.trim()||types[s.type]:types[s.type];
const markerModes=['انتخاب کنید','همراه نمونه ارائه می‌شود','پژوهشگر تعیین می‌کند','نیاز به مشاوره'];
const months=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const jalali=new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
const dateParts=date=>Object.fromEntries(jalali.formatToParts(date).filter(p=>['year','month','day'].includes(p.type)).map(p=>[p.type,Number(p.value)]));
const currentYear=dateParts(new Date()).year;
const faDigits=value=>String(value).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
function monthDays(year,month){
 if(month<7)return 31;
 if(month<12)return 30;
 for(let day=18;day<=22;day++){
  const next=Date.UTC(year+622,2,day);
  const parts=dateParts(new Date(next));
  if(parts.year===year+1&&parts.month===1&&parts.day===1)return dateParts(new Date(next-86400000)).day;
 }
 return 29;
}
const supplyModes=['انتخاب کنید','تأمین توسط محقق','تأمین توسط پژوهشکده','نیازمند مشاوره'];
const materialKinds=['دارو / مادهٔ آزمایشی (ثبت پیشین)','پرایمر','مارکر / مورد قابل اندازه‌گیری','سایر اقلام','مادهٔ آزمایشی','کیت / معرف','دارو'];
let destinations=[{group:'انبار',key:'warehouse',name:'انبار نمونه‌های پژوهشی'}];
const returnPolicy='در صورت امکان بازگشت، هماهنگی تحویل نمونه‌های باقی‌مانده تا دو هفته پس از اعلام نتیجه انجام می‌شود.';
const materialsConfirmText='تأیید می‌کنم اطلاعات و وضعیت سلامت ظاهری اقلامی که تحویل می‌دهم را بررسی کرده‌ام.';
const confirmText='تأیید می‌کنم اطلاعات نمونه‌ها و شرایط اعلام‌شده برای حمل صحیح‌اند و مجوزها و رضایت‌های لازم، در صورت شمول، اخذ شده‌اند.';
const stageNames=['مشخصات محقق','اطلاعات نمونه / داروها','شرایط پذیرش'];
const live=/^https?:$/.test(location.protocol)&&location.pathname==='/synapse-sample-form.html';
const embedded=window.parent!==window;
const referralsOnly=live&&new URLSearchParams(location.search).get('mode')==='referrals';
if(embedded)document.documentElement.dataset.embedded='';
const endpoint='/api/sample-intake/researcher';
let currentRevision=0, saving=false, canCreate=!live, canEdit=!live, canRefer=!live;
const locked=()=>live&&(referralsOnly||!canCreate||(currentRevision>0&&!canEdit));
const storageKey='synapse-sample-form-preview-v1';
const oldAssays=[1,2,3,4,5,6];
const form=document.querySelector('#wizard');
const message=document.querySelector('#message');
const search=document.querySelector('#search');
const status=document.querySelector('#archiveStatus');
const numFmt=new Intl.NumberFormat('fa-IR',{maximumSignificantDigits:15});
const fa=value=>numFmt.format(value);
const digits=value=>String(value).replace(/[۰-۹٠-٩]/g,d=>String('۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩'.indexOf(d)%10));
const numeric=value=>digits(value).trim().replace('٫','.');
const safe=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sheetId=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function newMaterial(){return {kind:6,name:'',count:'',amount:'',unit:-1}}
function newSample(){return {type:0,name:'',species:0,originNotes:'',code:'',groups:[''],markerMode:0,markers:'',count:'',amount:'',unit:-1,condition:0,container:'',year:'',month:'',day:'',hour:'',minute:'',dateKind:'',supplyMode:0,materials:[],materialsConfirmed:false,assays:[],otherTechnique:'',notes:''}}
function newSheet(){return {name:'',org:'',mobile:'',invoice:'',email:'',samples:[newSample()],delivery:0,temp:1,transport:'',biosafety:'',confirmed:false}}
let data=newSheet(), stage=0, furthest=0, review=false, openSample=0, page=0, currentId=sheetId();
let records=[];
if(!live)try{
 const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');
 if(Array.isArray(saved))records=saved.map(record=>({...record,catalogVersion:2,sheet:{...record.sheet,samples:record.sheet.samples.map(sample=>{
  const date=sample.collected&&new Date(sample.collected+'Z');
  const d=date&&Number.isFinite(date.getTime())?dateParts(date):null;
  const choices=Array.isArray(sample.assays)?sample.assays:[record.sheet.assay];
  return {...newSample(),...(d?{year:String(d.year),month:String(d.month),day:String(d.day),hour:sample.collected.slice(11,13),minute:sample.collected.slice(14,16)}:{}),
   ...sample,assays:record.catalogVersion===2?choices:choices.map(index=>oldAssays[index]).filter(Number.isInteger)};
 })}}));
}catch{}
const positive=value=>/^\d+(?:\.\d+)?$/.test(numeric(value))&&Number(numeric(value))>0&&Number.isFinite(Number(numeric(value)));
const countValue=value=>/^\d+$/.test(numeric(value))&&Number.isSafeInteger(Number(numeric(value)))?Number(numeric(value)):0;
const totalContainers=sheet=>sheet.samples.reduce((sum,s)=>sum+countValue(s.count),0);
const validMobile=value=>/^(?:09|\+989|00989)\d{9}$/.test(digits(value).replace(/[\s()-]/g,''));
const validContact=sheet=>!!sheet.name.trim()&&validMobile(sheet.mobile)&&!!sheet.invoice.trim()&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(sheet.email.trim());
const validCollection=s=>/^\d{4}$/.test(s.year)&&Number(s.year)>=1200&&Number(s.year)<=currentYear+(s.type===8?20:1)&&
 /^(?:[1-9]|1[0-2])$/.test(s.month)&&/^[1-9]\d?$/.test(s.day)&&Number(s.day)<=monthDays(Number(s.year),Number(s.month));
const dateKind=s=>s.type===8?'expiry':'collection';
const dateLabel=s=>dateKind(s)==='expiry'?'تاریخ انقضای دارو / ماده':s.type===0?'تاریخ برداشت بافت':'تاریخ برداشت / جمع‌آوری نمونه';
function missingField(s){
 if(s.type===otherType&&!s.name.trim())return '[data-other-type] input';
 if(!s.species)return '[name=species]';
 if(s.species===species.length-1&&!s.originNotes.trim())return '[name=originNotes]';
 const group=s.groups.findIndex(name=>!name.trim());
 if(group!==-1)return '[data-group="'+group+'"]';
 if(countValue(s.count)<1)return '[name=count]';
 if(!validQuantity(s))return '[name=amount]';
 if(!units[s.unit])return '[name=unit]';
 if(!validCollection(s)||(dateKind(s)==='expiry'&&s.dateKind!=='expiry'))return '[name=collection]';
 if(!s.supplyMode)return '[name=supplyMode]';
 if(s.supplyMode===1){
  if(!s.materials.length)return '[data-action=add-material]';
  const index=s.materials.findIndex(m=>!m.name.trim()||!validQuantity(m)||!units[m.unit]);
  if(index!==-1){
   const m=s.materials[index];
   return '[data-material="'+index+'"] [name='+(!m.name.trim()?'name':!countValue(m.count)?'count':!validQuantity(m)?'amount':'unit')+']';
  }
  if(!s.materialsConfirmed)return '[name=materialsConfirmed]';
 }
 if(!s.assays.length)return '[data-assay]';
 if(s.assays.includes(6)&&!s.otherTechnique.trim())return '[name=otherTechnique]';
 return '';
}
const validSample=s=>!missingField(s);
const canReview=()=>validContact(data)&&data.samples.every(validSample)&&data.confirmed;
const input=(object,key,label,attrs='',extra='')=>`<label class="${extra}">${label}<input name="${key}" value="${safe(object[key])}" ${attrs}></label>`;
const textarea=(object,key,label,placeholder,extra='')=>`<label class="${extra}">${label}<textarea name="${key}" rows="2" placeholder="${safe(placeholder)}">${safe(object[key])}</textarea></label>`;
const select=(object,key,label,options)=>`<label>${label}<select name="${key}">${options.map((v,i)=>`<option value="${i}"${object[key]===i?' selected':''}>${safe(v)}</option>`).join('')}</select></label>`;
const radio=(key,label,options)=>`<fieldset class="choice"><legend>${label}</legend>${options.map((v,i)=>`<label><input type="radio" name="${key}" value="${i}"${data[key]===i?' checked':''}>${safe(v)}</label>`).join('')}</fieldset>`;
const unitSelect=item=>`<label>واحد اندازه‌گیری *<select name="unit" required><option value="-1">انتخاب واحد</option>${units.map((unit,i)=>`<option value="${i}" ${item.unit===i?'selected':''}>${unit}</option>`).join('')}</select></label>`;
const totalText=s=>validQuantity(s)&&units[s.unit]?`${fa(countValue(s.count))} × ${fa(Number(numeric(s.amount)))} = ${fa(countValue(s.count)*Number(numeric(s.amount)))} ${units[s.unit]}`:'';

function calendarDays(year,month,selected){
 const target=year*10000+month*100+1;
 let low=Date.UTC(year+621,2,18)/86400000,high=Date.UTC(year+622,2,24)/86400000;
 while(low<=high){
  const mid=Math.floor((low+high)/2),date=new Date(mid*86400000),parts=dateParts(date);
  const key=parts.year*10000+parts.month*100+parts.day;
  if(key===target){
   const offset=(date.getUTCDay()+1)%7;
   return ['ش','ی','د','س','چ','پ','ج'].map(v=>'<small>'+v+'</small>').join('')+'<span></span>'.repeat(offset)+Array.from({length:monthDays(year,month)},(_,i)=>'<button type="button" data-action="calendar-day" data-day="'+(i+1)+'" aria-pressed="'+(String(i+1)===selected)+'">'+faDigits(i+1)+'</button>').join('');
  }
  if(key<target)low=mid+1;else high=mid-1;
 }
 return '';
}

function render(focus=false){
 document.querySelector('#stepProgress').style.width=stage*50+'%';

 form.dataset.stage=String(stage);
 const shell=form.closest('.shell');
 shell.hidden=(referralsOnly||!canCreate)&&!review;
 form.innerHTML=shell.hidden?'':[contact,samples,conditionsStep][stage]();
 updateSampleStatus();
 if(focus){
  const heading=form.querySelector('[data-heading]');
  heading.focus({preventScroll:true});
  if(embedded)document.querySelector('main').scrollIntoView({block:'start'});
  else window.scrollTo(0,0);
 }
}
function go(i){stage=i;review=false;message.textContent='';render(true)}
function updateSampleStatus(){
 if(stage!==1||!form.querySelector('#sampleContinue'))return;
 const index=data.samples.findIndex(s=>!validSample(s));
 const selector=index===-1?'':missingField(data.samples[index]);
 const field=index===-1?null:form.querySelector('[data-sample="'+index+'"]')?.querySelector(selector);
 const group=field?.dataset.group;
 const material=field?.closest('[data-material]');
 const label=group!==undefined?'نام گروه '+fa(Number(group)+1)
  : selector==='[data-assay]'?'انتخاب حداقل یک آزمون'
  : selector==='[data-action=add-material]'?'افزودن حداقل یک قلم همراه'
  : selector==='[name=materialsConfirmed]'?'تأیید وضعیت اقلام همراه'
  : selector==='[name=collection]'?dateLabel(data.samples[index])
  : field?.closest('label')?.firstChild?.textContent.trim().replace(/\s*\*$/,'')||'اطلاعات الزامی';
 form.querySelector('#sampleIncomplete').textContent=field?'نمونهٔ '+fa(index+1)+' '+(material?'، قلم '+fa(Number(material.dataset.material)+1)+' ':'')+'، '+label+' را تکمیل کنید.':'';
 form.querySelector('#sampleContinue').setAttribute('aria-disabled',String(index!==-1));
}
function updateField(e){
 const field=e.target;
 if(locked()||!field.name&&!field.matches('[data-group],[data-assay]'))return;
 const card=field.closest('[data-sample]');
 const target=card?data.samples[Number(card.dataset.sample)]:data;
 if(field.matches('[data-group]')){
  target.groups[Number(field.dataset.group)]=field.value;
  data.confirmed=false;return;
 }
 if(field.matches('[data-assay]')){
  const index=Number(field.dataset.assay);
  target.assays=field.checked?[...target.assays,index]:target.assays.filter(value=>value!==index);
  card.querySelector('[data-assay-other]').hidden=!target.assays.includes(6);
  data.confirmed=false;return;
 }
 const material=field.closest('[data-material]');
 if(material){
  const item=target.materials[Number(material.dataset.material)];
  if(!Object.hasOwn(item,field.name))return;
  item[field.name]=field.tagName==='SELECT'?Number(field.value):field.value;
  target.materialsConfirmed=false;
  card.querySelector('[name=materialsConfirmed]').checked=false;
  material.querySelector('[data-material-title]').textContent=item.name||materialKinds[item.kind];
  data.confirmed=false;return;
 }
 if(field.name==='collectionTime'){
  [target.hour,target.minute]=field.value?field.value.split(':'):['',''];
  data.confirmed=false;return;
 }
 if(!Object.hasOwn(target,field.name))return;
 const previousDateKind=card?dateKind(target):'';
 const dateKeys=['year','month','day','hour','minute'];
 target[field.name]=field.type==='checkbox'?field.checked:(field.type==='radio'||field.tagName==='SELECT')&&!dateKeys.includes(field.name)?Number(field.value):field.value;
 if(field.name!=='confirmed')data.confirmed=false;
 if(card){
  if(field.name==='supplyMode')target.materialsConfirmed=false;
  if(field.name==='type'){
   if(previousDateKind!==dateKind(target))Object.assign(target,{dateKind:'',year:'',month:'',day:'',hour:'',minute:''});
   else if(target.type!==0)Object.assign(target,{hour:'',minute:''});
   card.querySelector('.collection').outerHTML=sampleDate(target);
  }
  if(field.name==='supplyMode')card.querySelector('[data-materials]').hidden=target.supplyMode!==1;
  if(field.name==='species')card.querySelector('[data-origin]').hidden=target.species!==species.length-1;
  if(field.name==='type')card.querySelector('[data-other-type]').hidden=target.type!==otherType;
  if(field.name==='type'||field.name==='name')card.querySelector('summary').textContent='نمونه شماره '+fa(Number(card.dataset.sample)+1)+' · '+sampleName(target);
  card.querySelector('output').textContent=totalText(target);
  document.querySelector('#containers').textContent=fa(totalContainers(data))+' نمونه / ظرف';
 }else{
  const checkbox=form.querySelector('input[name=confirmed]');
  if(checkbox){checkbox.checked=data.confirmed;document.querySelector('#review').disabled=!canReview()}
 }
 message.textContent='';
}
function refreshCalendar(cal){

 const s=data.samples[Number(cal.closest('[data-sample]').dataset.sample)];
 cal.querySelector('.calendar-days').innerHTML=calendarDays(Number(cal.dataset.year),Number(cal.dataset.month),s.year===cal.dataset.year&&s.month===cal.dataset.month?s.day:'');
}

form.addEventListener('input',e=>{updateField(e);updateSampleStatus()});
form.addEventListener('submit',e=>{
 e.preventDefault();
 if(locked())return;
 if(stage===0&&!validContact(data)){
  message.textContent='نام پژوهشگر، شماره موبایل ایران، ایمیل معتبر و شماره فاکتور را وارد کنید.';
  form.elements[!data.name.trim()?'name':!validMobile(data.mobile)?'mobile':!data.email.trim()||!form.elements.email.validity.valid?'email':'invoice'].focus();return;
 }
 if(stage===1){
  const invalid=data.samples.findIndex(s=>!validSample(s));
  if(invalid!==-1){
   const card=form.querySelector('[data-sample="'+invalid+'"]');card.open=true;
   updateSampleStatus();
   const field=card.querySelector(missingField(data.samples[invalid]));
   const item=field.closest('[data-material]');
   if(item)item.open=true;
   field.focus();return;
  }
 }
 if(stage<2){furthest=Math.max(furthest,stage+1);go(stage+1)}
 else if(canReview()){review=true;render(true)}
});
document.querySelector('#steps').addEventListener('click',e=>{
 const button=e.target.closest('button[data-stage]');
 if(!button||locked())return;
 const next=Number(button.dataset.stage);
 if(next>0&&!validContact(data)){go(0);message.textContent='ابتدا مشخصات پژوهشگر را کامل کنید.';return}
 if(next===2&&!data.samples.every(validSample)){go(1);message.textContent='ابتدا اطلاعات نمونه‌ها را کامل کنید.';return}
 go(next);
});
function persist(next){
 try{localStorage.setItem(storageKey,JSON.stringify(next));records=next;return true}
 catch{status.textContent='ذخیرهٔ آزمایشی در این مرورگر در دسترس نیست.';return false}
}
form.addEventListener('click',async e=>{
 const button=e.target.closest('button[data-action]');
 if(!button||locked())return;
 switch(button.dataset.action){
  case 'calendar-toggle': {
   const cal=button.nextElementSibling;
   cal.hidden=!cal.hidden;button.setAttribute('aria-expanded',String(!cal.hidden));break;
  }
  case 'calendar-prev':
  case 'calendar-next': {
   const cal=button.closest('.calendar');
   const offset=button.dataset.action==='calendar-next'?1:-1;
   const index=Number(cal.dataset.month)-1+offset;
   const year=Number(cal.dataset.year)+Math.floor(index/12);
   if(year<1200||year>Number(cal.querySelector('[data-calendar-year]').options[0].value))break;
   cal.querySelector('[data-calendar-year]').value=String(year);
   cal.querySelector('[data-calendar-month]').value=String((index+12)%12+1);
   refreshCalendar(cal);break;
  }
  case 'calendar-day': {
   const cal=button.closest('.calendar'),s=data.samples[Number(cal.closest('[data-sample]').dataset.sample)];
   Object.assign(s,{dateKind:dateKind(s),year:cal.dataset.year,month:cal.dataset.month,day:button.dataset.day});
   data.confirmed=false;message.textContent='';refreshCalendar(cal);
   const trigger=cal.previousElementSibling;
   trigger.textContent=faDigits(s.year+'/'+s.month.padStart(2,'0')+'/'+s.day.padStart(2,'0'));
   cal.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();updateSampleStatus();break;
  }
  case 'add-group':
  case 'remove-group': {
   openSample=Number(button.closest('[data-sample]').dataset.sample);
   const groups=data.samples[openSample].groups;
   if(button.dataset.action==='add-group')groups.push('');else groups.splice(Number(button.dataset.index),1);
   data.confirmed=false;render();
   form.querySelector('[data-sample="'+openSample+'"] [data-group="'+(groups.length-1)+'"]').focus();
   break;
  }
  case 'add-material':
  case 'remove-material': {
   openSample=Number(button.closest('[data-sample]').dataset.sample);
   const items=data.samples[openSample].materials;
   if(button.dataset.action==='add-material')items.push(newMaterial());
   else items.splice(Number(button.closest('[data-material]').dataset.material),1);
   data.samples[openSample].materialsConfirmed=false;
   data.confirmed=false;render();
   const active=form.querySelector('[data-sample="'+openSample+'"]');
   (active.querySelector('[data-material="'+(items.length-1)+'"] [name=name]')||active.querySelector('[data-action=add-material]')).focus();
   break;
  }
  case 'back': go(stage-1);break;
  case 'add':
   data.samples.push(newSample());data.confirmed=false;openSample=data.samples.length-1;render();
   form.querySelector('[data-sample="'+openSample+'"] select').focus();break;
  case 'remove':
   if(data.samples.length<2)return;
   {const i=Number(button.closest('[data-sample]').dataset.sample);
    data.samples.splice(i,1);data.confirmed=false;openSample=Math.min(i,data.samples.length-1);render();
    form.querySelector('[data-sample="'+openSample+'"] summary').focus();}
   break;
  case 'save':
   if(!review||!canReview()||saving)return;
   {const existing=records.find(record=>record.id===currentId);
    const sheet=JSON.parse(JSON.stringify(data));
    for(const sample of sheet.samples){
     if(sample.supplyMode!==1){sample.materials=[];sample.materialsConfirmed=false}
     if(!sample.assays.includes(6))sample.otherTechnique='';
    }
    const record={id:currentId,catalogVersion:2,sheet,destination:existing?.destination||'',updatedAt:new Date().toISOString()};
    saving=true;button.disabled=true;
    try{
     if(live){
      const saved=await send({action:'save',id:record.id,revision:currentRevision,sheet:record.sheet});
      if(currentId===saved.id){currentRevision=saved.revision;render()}
     }else if(!persist([record,...records.filter(entry=>entry.id!==record.id)])){
      throw new Error('ذخیرهٔ آزمایشی در این مرورگر در دسترس نیست.');
     }
     document.querySelector('#archive').open=true;
     search.value='';page=0;drawArchive();
     status.textContent=live?'برگه در سامانه ذخیره شد.':'برگهٔ آزمایشی در همین مرورگر ذخیره شد.';
     status.scrollIntoView({block:'nearest'});
    }catch(error){message.textContent=error.message;message.scrollIntoView({block:'nearest'})}
    finally{saving=false;button.disabled=false}
   }
   break;
 }
});
const normal=value=>digits(value).trim().replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase();
function destinationOptions(record){
 const selected=record.destinationKey||'';
 const groups=new Map();
 for(const item of destinations){
  if(!groups.has(item.group))groups.set(item.group,[]);
  groups.get(item.group).push(item);
 }
 const previous=record.destination&&!destinations.some(item=>item.key===selected)
  ? `<option value="" selected disabled>${safe(record.destination)}</option>`:'';
 return `<option value="">${record.destination?'برداشتن ارجاع':'انتخاب مقصد ارجاع'}</option>${previous}`+
  [...groups].map(([group,items])=>`<optgroup label="${safe(group)}">${items.map(item=>`<option value="${safe(item.key)}" ${selected===item.key?'selected':''}>${safe(item.name)}</option>`).join('')}</optgroup>`).join('');
}
function drawArchive(){
 const q=normal(search.value);
 const matches=records.filter(r=>normal(r.sheet.name).includes(q)||normal(r.sheet.invoice).includes(q));
 const collator=new Intl.Collator('fa',{numeric:true});
 matches.sort((a,b)=>collator.compare(a.sheet.name,b.sheet.name)||collator.compare(a.sheet.invoice,b.sheet.invoice)||b.updatedAt.localeCompare(a.updatedAt));
 const size=10;
 page=Math.max(0,Math.min(page,Math.ceil(matches.length/size)-1));
 const view=matches.slice(page*size,(page+1)*size);
 let group='';
 document.querySelector('#archiveCount').textContent=fa(records.length);
 document.querySelector('#records').innerHTML=view.length?view.map(record=>{
  const sheet=record.sheet, heading=sheet.name.trim(), newGroup=group!==heading;group=heading;
  return (newGroup?`<h3><bdi>${safe(heading)}</bdi></h3>`:'')+`<div class="record" data-id="${safe(record.id)}"><div><bdi>${safe(sheet.invoice||'بدون شماره فاکتور')}</bdi> <small>· ${fa(totalContainers(sheet))} ظرف / نمونه</small></div><div class="row"><button type="button" data-open>باز کردن</button>${canRefer?`<select aria-label="مقصد پرونده">${destinationOptions(record)}</select>`:record.destination?`<small>${safe(record.destination)}</small>`:''}${canEdit&&live?'<button type="button" data-remove-sheet>حذف برگه</button>':''}</div></div>`;
 }).join('')+`<div class="actions"><button type="button" data-page="-1" ${page===0?'disabled':''}>صفحهٔ قبل</button><small>${fa(page+1)} از ${fa(Math.ceil(matches.length/size))}</small><button type="button" data-page="1" ${(page+1)*size>=matches.length?'disabled':''}>صفحهٔ بعد</button></div>`:'<p class="hint">پرونده‌ای برای نمایش وجود ندارد.</p>';
}
search.addEventListener('input',()=>{page=0;drawArchive()});
document.querySelector('#newSheet').addEventListener('click',()=>{if(saving||!canCreate||referralsOnly)return;data=newSheet();currentId=sheetId();currentRevision=0;furthest=0;openSample=0;go(0)});
document.querySelector('#records').addEventListener('click',async e=>{
 const pager=e.target.closest('[data-page]');
 if(pager){page+=Number(pager.dataset.page);drawArchive();return}
 const remove=e.target.closest('[data-remove-sheet]');
 if(remove){
  const record=records.find(r=>r.id===remove.closest('[data-id]').dataset.id);
  if(!canEdit||!record||saving||remove.disabled||!confirm('این برگه و همهٔ نمونه‌های داخل آن حذف شوند؟'))return;
  remove.disabled=true;
  try{
   await send({action:'delete',id:record.id,revision:record.revision});
   if(currentId===record.id)document.querySelector('#newSheet').click();
   status.textContent='برگه از فهرست حذف شد.';
  }catch(error){status.textContent=error.message}
  finally{drawArchive()}
  return;
 }
 const button=e.target.closest('[data-open]');
 if(!button)return;
 const record=records.find(r=>r.id===button.closest('[data-id]').dataset.id);
 if(!record||saving)return;
 currentRevision=record.revision||0;
 data=JSON.parse(JSON.stringify(record.sheet));
 data.samples=data.samples.map(sample=>({...newSample(),...sample,groups:sample.groups?.length?sample.groups:['']}));
 currentId=record.id;stage=2;furthest=2;openSample=0;review=true;message.textContent='';render(true);
});
document.querySelector('#records').addEventListener('change',async e=>{
 const select=e.target;
 if(select.tagName!=='SELECT')return;
 const id=select.closest('[data-id]').dataset.id;
 if(!canRefer||select.value&&!destinations.some(item=>item.key===select.value))return;
 if(live){
  const record=records.find(entry=>entry.id===id);
  if(!record||select.disabled)return;
  const destination=select.value;
  select.disabled=true;
  try{
   const saved=await send({action:'destination',id,revision:record.revision,destination});
   if(currentId===id&&currentRevision===record.revision)currentRevision=saved.revision;
   status.textContent=destination?'مقصد ثبت شد.':'مقصد پاک شد.';
  }catch(error){status.textContent=error.message}
  finally{drawArchive()}
  return;
 }
 if(persist(records.map(record=>record.id===id?{...record,destination:destinations.find(item=>item.key===select.value)?.name||'',destinationKey:select.value}:record))){
  status.textContent=select.value?'مقصد آزمایشی یادداشت شد.':'مقصد آزمایشی پاک شد.';
 }else drawArchive();
});
async function send(body){
 const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const result=await response.json();
 if(!response.ok)throw new Error(result.error||'ذخیره انجام نشد.');
 if(body.action==='delete'){records=records.filter(record=>record.id!==body.id);return}
 records=[result.record,...records.filter(record=>record.id!==result.record.id)];
 return result.record;
}
async function loadArchive(){
 try{
  const response=await fetch(endpoint+(referralsOnly?'?mode=referrals':''),{cache:'no-store'});
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'خواندن پرونده‌ها انجام نشد.');
  canCreate=result.canCreate===true;
  canEdit=result.canEdit===true;
  canRefer=result.canRefer===true;
  destinations=result.destinations;
  document.querySelector('#newSheet').hidden=!canCreate;
  render();
  const current=new Map(records.map(record=>[record.id,record]));
  for(const record of result.records){
   if((current.get(record.id)?.revision||0)<record.revision)current.set(record.id,record);
  }
  records=[...current.values()];
  drawArchive();
 }catch(error){status.textContent=error.message;document.querySelector('#archive').open=true}
}
if(live){
 document.querySelector('#previewBadge').hidden=true;
 document.querySelector('#staffIntakeLink').hidden=referralsOnly;
 document.querySelector('#newSheet').hidden=true;
 document.querySelector('#archiveTitle').textContent=referralsOnly?'برگه‌های ارجاعی نمونه':'پرونده‌های ذخیره‌شده';
 document.querySelector('#archiveHelp').textContent='برگه‌ها با نام پژوهشگر گروه‌بندی می‌شوند. با نام یا شماره فاکتور جست‌وجو کنید.';
 if(embedded||referralsOnly)document.querySelector('#archive').open=true;
 loadArchive();
}
render();drawArchive();
</script>
</body>
</html>
